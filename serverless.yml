service: sureplug-media-pipeline

frameworkVersion: '4'

provider:
  name: aws
  runtime: nodejs22.x
  architecture: arm64
  region: ${env:AWS_REGION, 'eu-west-2'}
  stage: ${opt:stage, 'dev'}
  environment:
    MEDIA_S3_BUCKET: ${env:MEDIA_S3_BUCKET}
    BLUR_SCORE_THRESHOLD: ${env:BLUR_SCORE_THRESHOLD, '100'}
    REPLICATE_API_TOKEN: ${env:REPLICATE_API_TOKEN}
    BACKGROUND_REMOVAL_MODEL_VERSION: ${env:BACKGROUND_REMOVAL_MODEL_VERSION}
    REMOVE_BACKGROUND_CALLBACK_BASE_URL: ${env:REMOVE_BACKGROUND_CALLBACK_BASE_URL}
    SOURCE_IMAGE_URL_TTL_SECONDS: ${env:SOURCE_IMAGE_URL_TTL_SECONDS, '900'}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - s3:GetObject
          Resource: 'arn:aws:s3:::${env:MEDIA_S3_BUCKET}/*'

plugins:
  - serverless-esbuild
  - serverless-step-functions

custom:
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    exclude:
      - sharp
    target: node22
    platform: node
    packagerOptions:
      scripts:
        - npm rebuild sharp --platform=linux --arch=arm64

functions:
  blurCheck:
    handler: src/functions/blur-check/handler.handler
  removeBackground:
    handler: src/functions/remove-background/handler.handler
    timeout: 15

stepFunctions:
  stateMachines:
    mediaPipeline:
      name: ${self:service}-${sls:stage}-media-pipeline
      definition:
        Comment: SurePlug product-image processing pipeline - blur check and background-removal submission are the only stages implemented so far; RemoveBackground waits on a callback that doesn't exist yet
        StartAt: BlurCheck
        States:
          BlurCheck:
            Type: Task
            Resource:
              Fn::GetAtt: [blurCheck, Arn]
            Next: CheckBlurResult
          CheckBlurResult:
            Type: Choice
            Choices:
              - Variable: "$.isBlurry"
                BooleanEquals: true
                Next: TooBlurry
            Default: RemoveBackground
          TooBlurry:
            Type: Succeed
          RemoveBackground:
            Type: Task
            Resource: arn:aws:states:::lambda:invoke.waitForTaskToken
            Parameters:
              FunctionName:
                Fn::GetAtt: [removeBackground, Arn]
              Payload:
                TaskToken.$: "$$.Task.Token"
                fileId.$: "$.fileId"
                bucket.$: "$.bucket"
                rawKey.$: "$.rawKey"
            TimeoutSeconds: 900
            Next: PipelineNotYetImplemented
          PipelineNotYetImplemented:
            Type: Succeed
