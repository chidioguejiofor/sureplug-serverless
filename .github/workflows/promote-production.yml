name: Promote to production

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: >-
          Commit SHA to deploy to production - must already be on dev and
          already verified on staging (Serverless Framework has no EB-style
          version-label artifact to promote unchanged, so this re-deploys
          from that exact commit instead of reusing a pre-built artifact).
        required: true
      tag:
        description: >-
          Git tag to create on that commit once it is live in production
          (for example v1.4.0).
        required: true

permissions:
  contents: read

jobs:
  deploy-production:
    name: Deploy to production
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: write
    env:
      COMMIT_SHA: ${{ inputs.commit_sha }}
      RELEASE_TAG: ${{ inputs.tag }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      MEDIA_S3_BUCKET: ${{ vars.MEDIA_S3_BUCKET }}
      BACKGROUND_REMOVAL_MODEL_VERSION: ${{ vars.BACKGROUND_REMOVAL_MODEL_VERSION }}
      REMOVE_BACKGROUND_CALLBACK_BASE_URL: ${{ vars.REMOVE_BACKGROUND_CALLBACK_BASE_URL }}
      IMAGE_CLASSIFIER_MODEL_VERSION: ${{ vars.IMAGE_CLASSIFIER_MODEL_VERSION }}
      CLASSIFY_IMAGE_CALLBACK_BASE_URL: ${{ vars.CLASSIFY_IMAGE_CALLBACK_BASE_URL }}
      UPSCALE_MODEL_VERSION: ${{ vars.UPSCALE_MODEL_VERSION }}
      UPSCALE_CALLBACK_BASE_URL: ${{ vars.UPSCALE_CALLBACK_BASE_URL }}
      APP_INTERNAL_WEBHOOK_URL: ${{ vars.APP_INTERNAL_WEBHOOK_URL }}
      NOTIFICATION_DISPATCH_URL: ${{ vars.NOTIFICATION_DISPATCH_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate commit and tag
        run: |
          if ! [[ "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::commit_sha must be a full 40-char commit SHA"
            exit 1
          fi
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::tag must look like v1.4.0 (optionally with a -suffix)"
            exit 1
          fi
          if git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG" >/dev/null; then
            echo "::error::tag $RELEASE_TAG already exists"
            exit 1
          fi
          if ! git cat-file -e "$COMMIT_SHA^{commit}" 2>/dev/null; then
            echo "::error::commit $COMMIT_SHA is not in this repository"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$COMMIT_SHA" origin/dev; then
            echo "::error::commit $COMMIT_SHA is not on dev"
            exit 1
          fi
      - name: Check out the commit being promoted
        run: git checkout "$COMMIT_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Fetch secrets from AWS Secrets Manager
        run: |
          aws secretsmanager get-secret-value \
            --secret-id sureplug-serverless/production \
            --query SecretString --output text \
            | jq -r 'to_entries[] | "\(.key)=\(.value)"' \
            | while IFS='=' read -r key value; do
                echo "::add-mask::$value"
                echo "$key=$value" >> "$GITHUB_ENV"
              done
      - name: Deploy
        run: npx serverless deploy --stage production
      - name: Tag the released commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" "$COMMIT_SHA" -m "Production release $RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"
